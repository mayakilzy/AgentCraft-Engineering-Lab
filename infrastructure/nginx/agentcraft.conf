# AgentCraft frontend nginx config.
#
# Serves the Vite production build and proxies /api to the FastAPI backend.
# Designed to sit behind Nginx Proxy Manager (NPM) which terminates TLS.
#
# Mission J-FIX-04 updates:
#   - Added WebSocket upgrade headers (for future real-time features).
#   - Added SSE-friendly proxy buffering disable on /api.
#   - Honor X-Forwarded-* headers from NPM (trusted reverse proxy).
#   - Added /api/health/* short-circuit (no logging for health probes).
#   - Added static asset caching + gzip + X-XSS-Protection.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file path returns index.html so the React
    # router owns client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api proxy to the FastAPI backend (service name "api" on port 8000).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade (for future real-time features; currently
        # the app uses HTTP only, but the headers are safe to set).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers — NPM sets these; we pass them through to
        # the backend so it sees the real client IP + scheme.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Disable buffering for SSE-style streaming responses.
        proxy_buffering off;
        proxy_cache off;

        # Generous timeouts for long-running experiments.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health probe short-circuit: don't log /api/health/* in access logs.
    location /api/health/ {
        proxy_pass http://api:8000;
        access_log off;
    }

    # G07/T26: block external access to /metrics.
    # The /metrics endpoint is for Prometheus on the private network.
    location /metrics {
        deny all;
        return 403 "metrics endpoint is not publicly accessible";
    }

    # Static asset caching (Vite fingerprints filenames with hashes).
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers (basic; production TLS handled at NPM).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip for text-based responses.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;
}
