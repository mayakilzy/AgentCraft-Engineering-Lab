# AgentCraft frontend nginx config.
# - Serve static assets from /
# - Proxy /api/* to the FastAPI backend (service name "api" on port 8000).
# - G07/T26: block external access to /metrics (ADR-0003 Part B #3).
#   The /metrics endpoint exposes internal route patterns (path_template
#   labels). It must NOT be publicly accessible in production. Prometheus
#   scrapes it on the private Docker network (not through nginx).
# - Set a conservative set of headers; no TLS here (TLS termination at the
#   reverse proxy in production per the deployment contract).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file path returns index.html so the React
    # router owns client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # G07/T26: block external access to /metrics.
    # The /metrics endpoint is for Prometheus on the private network.
    # External requests are denied with 403.
    location /metrics {
        deny all;
        return 403 "metrics endpoint is not publicly accessible";
    }

    # Security headers (basic; production TLS handled at reverse proxy).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
