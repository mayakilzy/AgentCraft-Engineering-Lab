# Prometheus scrape config — scrapes the API's /metrics endpoint + the
# OTEL Collector's Prometheus exporter. All on the private network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the FastAPI backend's /metrics endpoint.
  - job_name: "agentcraft-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Scrape the OTEL Collector's Prometheus exporter (pipeline metrics).
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
