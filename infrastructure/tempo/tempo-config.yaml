# Tempo config — receives traces via OTLP gRPC, stores locally.
# Minimal config for a learning lab; production would use S3 backend.
server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Search API for the Grafana Tempo datasource.
query_frontend:
  search:
    query_timeout: 30s

ingester:
  lifecycler:
    address: "127.0.0.1"
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
