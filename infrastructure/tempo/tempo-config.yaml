# Tempo config — receives traces via OTLP gRPC, stores locally.
# Minimal config for a learning lab; production would use S3 backend.
# G08-C3: removed query_frontend.search.query_timeout (not a valid
# field in Tempo 2.6.0 — causes config parse failure).
server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

ingester:
  lifecycler:
    address: "127.0.0.1"
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
