id: diagnose-hidden-failure
version: 1.2.0
module_id: observability
level: advanced
estimated_minutes: 30
title:
  en: Diagnose a Hidden Failure
  ar: تشخيص عطل خفي
description:
  en: Inject a bounded failure at a named step, use the trace to find the failing stage, then demonstrate recovery by running the same workflow WITHOUT injection and verify it passes.
  ar: أدخل عطلاً محدوداً في خطوة مسماة، استخدم التتبّع لتحديد المرحلة الفاشلة، ثم اعرض الاسترجاع بتشغيل نفس سير العمل WITHOUT حقن وتحقق من نجاحه.
technology: [OpenTelemetry, Grafana]
prerequisites: [trace-one-request, build-monitoring-dashboard]
dataset_key: failure-demo-v1
required_services: [postgres]
capabilities: [telemetry, failure-injection]
public_demo_enabled: true
steps:
  - id: inject
    title: {en: Inject failure, ar: أدخل العطل}
    instruction: {en: Run the inject_failure operation with fail_step=transform. The run must fail and the trace_id must be populated., ar: شغّل عملية inject_failure مع fail_step=transform. يجب أن يفشل التشغيل ويكون trace_id معبّأً.}
    operation_key: inject_failure
    input_schema_ref: inject_failure_v1
    validator_key: failure_diagnosis_v1
    inputs:
      run_id: e09
      fail_step: transform
    expected:
      failed_run:
        fail_step: transform
        trace_id_present: true
  - id: inspect
    title: {en: Inspect trace and logs, ar: افحص التتبّع والسجلات}
    instruction: {en: Use the observability links endpoint to find the failing span and the run's error_code., ar: استخدم نقطة روابط المراقبة لتحديد الفترة الفاشلة و error_code للتشغيل.}
    operation_key: inject_failure
    input_schema_ref: inject_failure_v1
    validator_key: failure_diagnosis_v1
    inputs:
      run_id: e09
      fail_step: transform
    expected:
      failed_run:
        fail_step: transform
        trace_id_present: true
  - id: mentor
    title: {en: Ask mentor, ar: استشر الموجّه}
    instruction: {en: Use the mentor endpoint (when configured) with the run_id; the deterministic fallback explains the failed step when no provider is configured., ar: استخدم نقطة الموجّه (إن وُجدت) مع run_id؛ البديل الحتمي يشرح الخطوة الفاشلة عند غياب المزوّد.}
    operation_key: inject_failure
    input_schema_ref: inject_failure_v1
    validator_key: failure_diagnosis_v1
    inputs:
      run_id: e09
      fail_step: transform
    expected:
      failed_run:
        fail_step: transform
        trace_id_present: true
  - id: recovery_demo
    title: {en: Recovery demonstration, ar: عرض الاسترجاع}
    instruction: {en: "Run run_trace_demo (a DIFFERENT operation from inject_failure) WITHOUT fail_step to demonstrate the workflow recovers when the injection is disabled. This is NOT a re-execution of the failed operation; it is a demonstration that the same fetch→transform→persist workflow succeeds without the injected failure.", ar: "شغّل run_trace_demo (عملية مختلفة عن inject_failure) WITHOUT fail_step لإثبات أن سير العمل يسترجع عندما يكون الحقن معطّلاً. هذه ليست إعادة تنفيذ للعملية الفاشلة؛ بل عرض أن نفس سير العمل (fetch→transform→persist) ينجح دون الفشل المُحقون."}
    operation_key: run_trace_demo
    input_schema_ref: trace_demo_v1
    validator_key: failure_diagnosis_v1
    inputs:
      run_id: e09_recovery
    expected:
      corrected_run_only: true
      corrected_run:
        status: ok
failure_mode: |
  An invalid fail_step (e.g. `evil-step`) produces `error_code=bad_input`.
  The validator asserts the failed run has a populated trace_id so the
  user can find the failing span in Grafana Tempo (ADR-0003 step 5).

  G06-C1 reviewer fix: the recovery step (step 4) runs `run_trace_demo`
  (operation_key=run_trace_demo), which is a DIFFERENT operation from
  the failed step's `inject_failure` (operation_key=inject_failure).
  The step is now named "recovery_demo" (not "rerun_corrected") and
  its instruction explicitly states this is a recovery demonstration,
  not a re-execution of the failed operation. Both operations share
  the same underlying _run_trace_demo function, but the manifest
  treats them as distinct operations with distinct operation_keys.

