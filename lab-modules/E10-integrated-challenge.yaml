id: integrated-challenge
version: 1.2.0
module_id: challenge
level: advanced
estimated_minutes: 40
title:
  en: Graph and Observability Challenge
  ar: تحدي الرسم والمراقبة
description:
  en: Identify the faulty dependency and its operational symptom using the graph plus the trace. Then demonstrate recovery by running the same workflow WITHOUT injection and verify it passes.
  ar: حدّد الاعتمادية المعيبة وأعراضها التشغيلية باستخدام الرسم والتتبّع. ثم اعرض الاسترجاع بتشغيل نفس سير العمل WITHOUT حقن وتحقق من نجاحه.
technology: [NetworkX, OpenTelemetry, Grafana]
prerequisites: [critical-dependencies, trace-one-request, build-monitoring-dashboard]
dataset_key: integrated-challenge-v1
required_services: [postgres]
capabilities: [graph-visualization, telemetry]
public_demo_enabled: true
steps:
  - id: load
    title: {en: Load integrated dependency graph, ar: حمّل رسم الاعتماديات المتكامل}
    instruction: {en: "Load the integrated dependency fixture (apps, tools and a deliberately failing path).", ar: حمّل بيانات الاعتماديات المتكاملة (تطبيقات وأدوات ومسار معتلّ متعمّد).}
    operation_key: seed_graph
    input_schema_ref: seed_graph_v1
    validator_key: seed_five_nodes_v1
    inputs:
      dataset_id: e10
      fixture_key: integrated-challenge-v1
    expected:
      node_count: 8
      edge_count: 8
  - id: paths
    title: {en: Inspect paths, ar: افحص المسارات}
    instruction: {en: Compute the shortest path from APP1 to T3. The path identifies the critical edge (APP1→T1)., ar: احسب أقصر مسار من APP1 إلى T3. يحدد المسار الحافة الحرجة (APP1→T1).}
    operation_key: shortest_path
    input_schema_ref: shortest_path_v1
    validator_key: shortest_path_directed_v1
    inputs:
      dataset_id: e10
      source: APP1
      target: T3
    expected:
      path: [APP1, T1, T3]
  - id: scenario
    title: {en: Execute scenario, ar: نفّذ السيناريو}
    instruction: {en: Inject a failure at the transform step and capture the trace_id., ar: أدخل عطلاً في خطوة transform والتقط trace_id.}
    operation_key: inject_failure
    input_schema_ref: inject_failure_v1
    validator_key: failure_diagnosis_v1
    inputs:
      run_id: e10
      fail_step: transform
    expected:
      failed_run:
        fail_step: transform
        trace_id_present: true
  - id: trace
    title: {en: View trace, ar: اعرض التتبّع}
    instruction: {en: Use the observability links endpoint to locate the failing span., ar: استخدم نقطة روابط المراقبة لتحديد الفترة الفاشلة.}
    operation_key: inject_failure
    input_schema_ref: inject_failure_v1
    validator_key: failure_diagnosis_v1
    inputs:
      run_id: e10
      fail_step: transform
    expected:
      failed_run:
        fail_step: transform
        trace_id_present: true
  - id: recovery_demo
    title: {en: Recovery demonstration, ar: عرض الاسترجاع}
    instruction: {en: "Run run_trace_demo (a DIFFERENT operation from inject_failure) WITHOUT fail_step to demonstrate the workflow recovers when the injection is disabled. This is NOT a re-execution of the failed operation; it is a demonstration that the same fetch→transform→persist workflow succeeds without the injected failure.", ar: "شغّل run_trace_demo (عملية مختلفة عن inject_failure) WITHOUT fail_step لإثبات أن سير العمل يسترجع عندما يكون الحقن معطّلاً. هذه ليست إعادة تنفيذ للعملية الفاشلة؛ بل عرض أن نفس سير العمل (fetch→transform→persist) ينجح دون الفشل المُحقون."}
    operation_key: run_trace_demo
    input_schema_ref: trace_demo_v1
    validator_key: failure_diagnosis_v1
    inputs:
      run_id: e10_recovery
    expected:
      corrected_run_only: true
      corrected_run:
        status: ok
failure_mode: |
  Both graph and telemetry assertions must pass for the experiment to
  pass. The shortest path (step 2) identifies the critical edge
  (APP1→T1→T3). The inject_failure steps (3-4) verify the failed run
  has a populated trace_id (ADR-0003 step 5). The recovery demonstration
  (step 5) verifies the workflow succeeds when the injection is
  disabled.

  G06-C1 reviewer fix: the recovery step (step 5) runs `run_trace_demo`
  (operation_key=run_trace_demo), which is a DIFFERENT operation from
  the failed step's `inject_failure` (operation_key=inject_failure).
  The step is now named "recovery_demo" (not "fix") and its instruction
  explicitly states this is a recovery demonstration, not a re-execution
  of the failed operation.
