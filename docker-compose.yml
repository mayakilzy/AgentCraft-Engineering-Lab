# AgentCraft Engineering Lab — Docker Compose.
# Profiles:
#   core          PostgreSQL + API + Frontend (V1.0 baseline)
#   observability OTEL Collector + Prometheus + Tempo + Grafana (wired in G04)
#   neo4j         Neo4j (wired in G03)
#
# Bring up the baseline:
#   docker compose --profile core up -d --build
#
# G04 adds:
#   docker compose --profile core --profile observability up -d --build

name: agentcraft

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-agentcraft}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentcraft}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [agentcraft-net]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agentcraft}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-agentcraft}
      MENTOR_PROVIDER: disabled
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GDS_LICENSED: ${GDS_LICENSED:-false}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [agentcraft-net]

  neo4j:
    image: neo4j:5-community
    profiles: [neo4j]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["gds"]'  # GDS plugin installed but license-gated
      NEO4J_dbms_security_auth__enabled: "true"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    networks: [agentcraft-net]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: [core]
    depends_on:
      - api
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [agentcraft-net]

volumes:
  pgdata:
  neo4jdata:

networks:
  agentcraft-net:
    driver: bridge
