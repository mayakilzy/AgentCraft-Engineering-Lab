# AgentCraft Engineering Lab — Docker Compose.
# Profiles:
#   core          PostgreSQL + API + Frontend (V1.0 baseline)
#   observability OTEL Collector + Prometheus + Tempo + Grafana (wired in G04)
#   neo4j         Neo4j (wired in G03)
#
# Bring up the baseline:
#   docker compose --profile core up -d --build
#
# G04 adds:
#   docker compose --profile core --profile observability up -d --build

name: agentcraft

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-agentcraft}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentcraft}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [agentcraft-net]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agentcraft}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-agentcraft}
      MENTOR_PROVIDER: disabled
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GDS_LICENSED: ${GDS_LICENSED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: agentcraft-api
      PROMETHEUS_URL: http://prometheus:9090
      TEMPO_URL: http://tempo:3200
      GRAFANA_URL: http://grafana:3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # G07-C1: the API is NOT exposed publicly. Nginx (the `web` service)
    # is the only public entry point. Prometheus scrapes /metrics on the
    # private Docker network (http://api:8000/metrics), not through the
    # public port. The `ports:` block is intentionally absent.
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [agentcraft-net]

  neo4j:
    image: neo4j:5-community
    profiles: [neo4j]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["gds"]'  # GDS plugin installed but license-gated
      NEO4J_dbms_security_auth__enabled: "true"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    networks: [agentcraft-net]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: [core]
    depends_on:
      - api
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [agentcraft-net]

  # ---- G07-C1-04: scheduled purge cron ----
  # Runs `python -m app.cleanup_purge` every 6 hours. The interval is
  # set by the container's entrypoint (sleep 6h between runs). A real
  # cron daemon (e.g., supervisord) is overkill for V1; the sleep loop
  # is simple and survives container restarts because the state is in
  # PostgreSQL, not in the container.
  # Retention: worst-case = 6h (purge interval) + 24h (session TTL) = 30h.
  # Tighten to sleep 3600 (1h) for stricter retention.
  purge-cron:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agentcraft}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-agentcraft}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    # The entrypoint runs the purge once, then sleeps 6h, then repeats.
    # On container restart, the loop resumes (state is in PostgreSQL).
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          python -m app.cleanup_purge || true
          echo "purge complete; sleeping 6h"
          sleep 21600
        done
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [agentcraft-net]

  # ---- Observability profile (wired in G04) ----
  # Bring up the full telemetry stack:
  #   docker compose --profile core --profile observability up -d --build
  # All services on the private network; no admin ports exposed publicly
  # except Grafana on :3000 (read-only dashboards; admin auth required).

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [agentcraft-net]

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [observability]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [agentcraft-net]

  tempo:
    image: grafana/tempo:2.6.0
    profiles: [observability]
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [agentcraft-net]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [agentcraft-net]

volumes:
  pgdata:
  neo4jdata:
  grafana-data:
  prometheus-data:
  tempo-data:

networks:
  agentcraft-net:
    driver: bridge
