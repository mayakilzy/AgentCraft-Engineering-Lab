# AgentCraft Engineering Lab — Docker Compose.
# Profiles:
#   core          PostgreSQL + API + Frontend (V1.0 baseline)
#   observability OTEL Collector + Prometheus + Tempo + Grafana (wired in G04)
#   neo4j         Neo4j (wired in G03)
#
# Bring up the baseline:
#   docker compose --profile core up -d --build
#
# G04 adds:
#   docker compose --profile core --profile observability up -d --build

name: agentcraft

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-agentcraft}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentcraft}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [agentcraft-net]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # G07-C2-03: all production settings are passed through from
      # the host environment (or .env file). The defaults are for
      # local dev only. When APP_ENV=production, the backend's
      # fail-closed validator (G07-C1-01) rejects insecure defaults.
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agentcraft}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-agentcraft}
      MENTOR_PROVIDER: ${MENTOR_PROVIDER:-disabled}
      # G07-C2-03: CORS_ORIGINS is passed through from .env. The
      # default is localhost for dev; production MUST override to the
      # real origin (the fail-closed validator rejects localhost in
      # production).
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GDS_LICENSED: ${GDS_LICENSED:-false}
      # G07-C2-03: production secrets passed through. The backend's
      # fail-closed validator checks these when APP_ENV=production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: agentcraft-api
      PROMETHEUS_URL: http://prometheus:9090
      TEMPO_URL: http://tempo:3200
      GRAFANA_URL: http://grafana:3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # G07-C1: the API is NOT exposed publicly. Nginx (the `web` service)
    # is the only public entry point. Prometheus scrapes /metrics on the
    # private Docker network (http://api:8000/metrics), not through the
    # public port. The `ports:` block is intentionally absent.
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [agentcraft-net]

  neo4j:
    image: neo4j:5-community
    profiles: [neo4j]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["graph-data-science"]'  # GDS plugin (correct name)
      NEO4J_dbms_security_auth__enabled: "true"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    networks: [agentcraft-net]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: [core]
    depends_on:
      - api
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [agentcraft-net]

  # ---- G07-C1-04 + G07-C2-02: scheduled purge cron ----
  # Runs `python -m app.cleanup_purge` every 6 hours. The exit status is
  # logged (NOT swallowed with `|| true`). Exit codes:
  #   0: success (all pending tasks resolved)
  #   1: error (DB error or unexpected exception)
  #   2: partial (some tasks pending retry or failed — alert worthy)
  # The sleep loop continues regardless, but the operator can alert on
  # non-zero exits via Docker logs.
  # G07-C2-04 retention: worst-case = 6h (purge interval) + 24h (TTL) = 30h.
  # To guarantee ≤24h, set sleep to 3600 (1h) OR session_ttl_hours to 18.
  purge-cron:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agentcraft}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-agentcraft}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
    # G07-C2-02: the entrypoint logs the exit status without swallowing it.
    # The sleep loop continues regardless, but non-zero exits are visible.
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] running purge..."
          python -m app.cleanup_purge
          rc=$?
          if [ $$rc -ne 0 ]; then
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] purge exited with code $$rc (non-zero — check logs)"
          fi
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] purge complete; sleeping 6h"
          sleep 21600
        done
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [agentcraft-net]

  # ---- Observability profile (wired in G04) ----
  # Bring up the full telemetry stack:
  #   docker compose --profile core --profile observability up -d --build
  # All services on the private network; no admin ports exposed publicly
  # except Grafana on :3000 (read-only dashboards; admin auth required).

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [agentcraft-net]

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [observability]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2h"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [agentcraft-net]

  tempo:
    image: grafana/tempo:2.6.0
    profiles: [observability]
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [agentcraft-net]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [agentcraft-net]

  # ---- G08-C2-1: test runner (separate lightweight image) ----
  # Runs the integration smoke script against the REAL services on
  # the private network. The production image stays clean (no pytest).
  # This service is started by the CI workflow via:
  #   docker compose run --rm --no-deps test-runner
  test-runner:
    build:
      context: .
      dockerfile: tests/Dockerfile.test
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      # C3 fix: the test-runner needs DATABASE_URL pointing to PostgreSQL
      # so that cleanup_purge + other DB operations work against the
      # real database, not SQLite.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agentcraft}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-agentcraft}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      APP_ENV: ${APP_ENV:-local}
    # No ports — connects to the private network only.
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [agentcraft-net]

volumes:
  pgdata:
  neo4jdata:
  grafana-data:
  prometheus-data:
  tempo-data:

networks:
  agentcraft-net:
    driver: bridge