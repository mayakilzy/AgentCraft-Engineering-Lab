# AgentCraft Engineering Lab — Docker Compose runtime smoke.
#
# G08-C3: this CI workflow runs the FULL Docker Compose stack and
# verifies the runtime integration using a SEPARATE test-runner
# container. The production image stays clean (no pytest).
#
# The API restart is done from the GitHub Actions host (not from
# inside a container). Cookie values are extracted to the host and
# passed to the test-runner via args.

name: Docker Compose Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env with runtime-generated secrets
        run: |
          PG_PW=$(openssl rand -hex 16)
          NEO4J_PW=$(openssl rand -hex 16)
          GRAFANA_PW=$(openssl rand -hex 16)
          printf 'APP_ENV=production\n' > .env
          printf 'POSTGRES_PASSWORD=%s\n' "$PG_PW" >> .env
          printf 'NEO4J_PASSWORD=%s\n' "$NEO4J_PW" >> .env
          printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$GRAFANA_PW" >> .env
          printf 'SESSION_COOKIE_SECURE=true\n' >> .env
          printf 'CORS_ORIGINS=["https://agentcraft.example"]\n' >> .env
          printf 'SESSION_TTL_HOURS=24\n' >> .env
          printf 'RATE_LIMIT_PER_MINUTE=60\n' >> .env
          printf 'GDS_LICENSED=false\n' >> .env
          printf 'NEO4J_URI=bolt://neo4j:7687\n' >> .env
          printf 'OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318\n' >> .env
          echo "PG_PW=${PG_PW}" >> $GITHUB_ENV
          echo "NEO4J_PW=${NEO4J_PW}" >> $GITHUB_ENV
          echo "GRAFANA_PW=${GRAFANA_PW}" >> $GITHUB_ENV

      - name: Build and start core stack
        run: |
          docker compose --profile core up -d --build
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c 'until docker compose ps postgres | grep -i healthy; do sleep 2; done'
          echo "Waiting for API..."
          timeout 120 bash -c 'until docker compose ps api | grep -i healthy; do sleep 2; done'

      - name: Build and start observability stack
        run: |
          docker compose --profile observability up -d --build
          echo "Waiting for Grafana..."
          timeout 120 bash -c 'until docker compose ps grafana | grep -i healthy; do sleep 2; done'

      - name: Build and start Neo4j stack
        run: |
          docker compose --profile neo4j up -d --build
          echo "Waiting for Neo4j..."
          timeout 180 bash -c 'until docker compose ps neo4j | grep -i healthy; do sleep 2; done'

      - name: Build test-runner image
        run: |
          docker compose --profile test build

      - name: Run integration smoke (first pass)
        run: |
          docker compose run --rm --no-deps test-runner

      - name: Create session + extract cookie to host
        run: |
          COOKIE_VALUE=$(docker compose run --rm --no-deps test-runner bash -c '
            curl -s -D /tmp/headers -o /tmp/body -X POST http://web:80/api/v1/sessions/guest \
              -H "Content-Type: application/json" \
              -d "{\"locale\":\"en\"}" 2>/dev/null
            BODY=$(cat /tmp/body 2>/dev/null || echo "")
            if [ -z "$BODY" ]; then
              echo "ERROR: empty response body" >&2
              exit 1
            fi
            COOKIE=$(cat /tmp/headers | grep -i set-cookie | \
              sed "s/.*ac_guest=//;s/;.*//" | tr -d "\r\n")
            if [ -z "$COOKIE" ]; then
              echo "ERROR: no ac_guest cookie" >&2
              exit 1
            fi
            echo -n "$COOKIE"
          ')
          if [ -z "$COOKIE_VALUE" ]; then
            echo "FAIL: could not create session or extract cookie"
            exit 1
          fi
          echo "Cookie extracted: ${COOKIE_VALUE:0:16}..."
          echo "COOKIE_VALUE=$COOKIE_VALUE" >> $GITHUB_ENV

      - name: Restart API from host
        run: |
          echo "Restarting API container from host..."
          docker compose restart api
          echo "Waiting for API to be healthy..."
          timeout 120 bash -c 'until docker compose ps api | grep -i healthy; do sleep 2; done'
          echo "API is healthy after restart"

      - name: Verify persistence using SAME cookie
        run: |
          if [ -z "$COOKIE_VALUE" ]; then
            echo "FAIL: no cookie value from previous step"
            exit 1
          fi
          docker compose run --rm --no-deps test-runner bash -c '
            COOKIE="$1"
            if [ -z "$COOKIE" ]; then
              echo "FAIL: cookie not passed" >&2
              exit 1
            fi
            ME=$(curl -sf http://web:80/api/v1/sessions/me \
              -H "Cookie: ac_guest=$COOKIE" 2>/dev/null || echo "")
            if [ -z "$ME" ]; then
              echo "FAIL: session not usable after restart" >&2
              exit 1
            fi
            echo "OK: SAME session usable after API restart"
            COUNT=$(curl -sf http://web:80/api/v1/experiments \
              -H "Cookie: ac_guest=$COOKIE" 2>/dev/null | \
              python -c "import json,sys; print(json.load(sys.stdin)[\"count\"])" 2>/dev/null || echo "0")
            if [ "$COUNT" != "10" ]; then
              echo "FAIL: expected 10 experiments, got $COUNT" >&2
              exit 1
            fi
            echo "OK: 10 experiments loaded after restart"
          ' -- "$COOKIE_VALUE"

      - name: Verify cookie flags from actual POST
        run: |
          docker compose run --rm --no-deps test-runner bash -c '
            curl -s -D /tmp/headers -o /dev/null -X POST http://web:80/api/v1/sessions/guest \
              -H "Content-Type: application/json" \
              -d "{\"locale\":\"en\"}" 2>/dev/null
            HEADER=$(cat /tmp/headers | grep -i set-cookie || echo "")
            if [ -z "$HEADER" ]; then
              echo "FAIL: no Set-Cookie header" >&2
              exit 1
            fi
            echo "Set-Cookie: $HEADER"
            if echo "$HEADER" | grep -qi "HttpOnly"; then
              echo "OK: HttpOnly present"
            else
              echo "FAIL: HttpOnly missing" >&2
              exit 1
            fi
            if echo "$HEADER" | grep -qi "SameSite"; then
              echo "OK: SameSite present"
            else
              echo "FAIL: SameSite missing" >&2
              exit 1
            fi
            if echo "$HEADER" | grep -qi "Secure"; then
              echo "OK: Secure present (production mode)"
            else
              echo "FAIL: Secure missing" >&2
              exit 1
            fi
            echo "NOTE: HTTPS transport test deferred to real deployment"
          '

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          for svc in postgres api web neo4j otel-collector prometheus tempo grafana purge-cron test-runner; do
            docker compose logs $svc > /tmp/logs/$svc.log 2>&1 || true
          done
          docker compose ps > /tmp/logs/ps.txt 2>&1 || true

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/logs/
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          docker compose --profile core --profile observability --profile neo4j --profile test down -v
