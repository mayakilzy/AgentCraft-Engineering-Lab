# Alembic configuration for AgentCraft Engineering Lab.
# The actual URL is resolved in env.py from Settings (env > .env > default).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Template used for new migration files.
# Default: generic (single-file with up/down markers).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for filenames.
timezone = UTC

[post_write_hooks]
# Hook for ruff formatting can be added in later groups.

# Logging config — JSON line to stdout, no file.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
